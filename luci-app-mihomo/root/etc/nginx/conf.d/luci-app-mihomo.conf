# luci-app-mihomo: 兼容 nginx 链路下的 LuCI rpc 大请求体
#
# LuCI 的 /ubus 端点由 nginx-ubus 模块 (nginx-mod-ubus) 处理, 该模块未实现
# "请求体落盘" 的读取逻辑: 请求体超过 client_body_buffer_size (nginx 默认
# 8k/16k, 随指针宽度) 时, nginx 把溢出部分写入临时文件, 模块按内存 buffer 链解析会
# 段错误, nginx worker 被杀, 连接无响应中断, 浏览器端表现为
# "XHR request aborted by browser" (上游: Ansuel/nginx-ubus-module#2)。
#
# 本包的「配置文件」页会把整份配置内容经 rpc fs.write 提交 (校验 / 保存),
# 远超默认缓冲。放大缓冲让请求体完整留在内存即可; uhttpd 逐块读取不存在
# 此问题, 本文件在 uhttpd 环境下不会被读取, 留着无害。
#
# 注意只设 client_body_buffer_size: OpenWrt 的 uci.conf.template 已在 http
# 块设了 client_max_body_size 128M, 这里再设会 duplicate directive, nginx -t
# 失败导致 restart 起不来 (25.12.5 实测)。请求体上限以模板的 128M 为准。
client_body_buffer_size 2m;
