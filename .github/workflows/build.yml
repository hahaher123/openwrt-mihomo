name: Build and release Mihomo APK

# 触发方式：
#   1. 自动 —— 推送到 main 且改动了两个包任一 Makefile 的版本号（PKG_VERSION /
#      PKG_RELEASE）时，自动构建并发布/更新 Release。判断依据是 tag 是否已存在：
#      tag = v<mihomo 版本>-r<修订>-luci<LuCI 版本>-r<修订>，两个包任一版本变化都会
#      得到新 tag，于是自动出包；只改了 Makefile 其它内容、版本没变时 tag 已存在，
#      整轮跳过，不浪费构建资源。
#   2. 手动 —— Actions 页面点 "Run workflow"，用于重跑同一版本、重新生成 Release；
#      勾选 force 可在版本没变时也强制重建并覆盖资产。
#
# 一次构建 x86_64 / aarch64_generic 两个架构的 APK（含 mihomo 与 luci-app-mihomo
# 两个包），按两个 Makefile 中的当前版本打 tag 并发布 Release；发布后自动裁剪旧
# Release，只保留最新 5 个（.ci/prune-releases.sh，git tag 一律保留）。
on:
  push:
    branches:
      - main
    # 只在版本号文件变化时触发。改代码本身不会发版 —— 按仓库约定，改安装产物要
    # 同时升 PKG_RELEASE，所以「该发版」的改动必然会让 Makefile 发生变化，
    # 而 README / CI 之类的改动不会白白触发一次构建。
    paths:
      - 'mihomo/Makefile'
      - 'luci-app-mihomo/Makefile'
  workflow_dispatch:
    inputs:
      force:
        description: '即使该版本 tag 已存在，也重新构建并覆盖 Release 资产'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 连续两次推 Makefile 时不要让两个构建并行抢同一个 tag / Release。
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析版本号并判断是否需要构建
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 按两个 Makefile 的版本拼 tag，判断是否已发布过
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          MIHOMO_VER=$(grep -m1 '^PKG_VERSION:=' mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          MIHOMO_REL=$(grep -m1 '^PKG_RELEASE:=' mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          LUCI_VER=$(grep -m1 '^PKG_VERSION:=' luci-app-mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          LUCI_REL=$(grep -m1 '^PKG_RELEASE:=' luci-app-mihomo/Makefile | cut -d= -f2 | tr -d ' ')

          for v in "$MIHOMO_VER" "$MIHOMO_REL" "$LUCI_VER" "$LUCI_REL"; do
            [ -n "$v" ] || { echo "::error::Makefile 里读不到 PKG_VERSION / PKG_RELEASE"; exit 1; }
          done

          # 完整包版本 = PKG_VERSION-PKG_RELEASE。两个包任一版本变化都会得到新 tag。
          TAG="v${MIHOMO_VER}-r${MIHOMO_REL}-luci${LUCI_VER}-r${LUCI_REL}"

          BUILD=true
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ "${FORCE}" = "true" ]; then
              REASON="tag ${TAG} 已存在，force=true：重新构建并覆盖 Release 资产"
            else
              REASON="tag ${TAG} 已存在（两个包的版本都没变）：跳过本次构建"
              BUILD=false
            fi
          else
            REASON="新版本 ${TAG}：开始构建并发布"
          fi
          echo "$REASON"

          {
            echo "### 版本判定"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| tag | \`${TAG}\` |"
            echo "| mihomo | ${MIHOMO_VER}-r${MIHOMO_REL} |"
            echo "| luci-app-mihomo | ${LUCI_VER}-r${LUCI_REL} |"
            echo "| 是否构建 | ${BUILD} |"
            echo "| 说明 | ${REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK and publish release
    needs: prepare
    # tag 已存在且非 force 时整轮跳过：不编译、不打 tag、不动 Release。
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest

    env:
      # 构建用的 OpenWrt 发行版：决定 gh-action-sdk 拉哪个 SDK 镜像
      # （x86_64-<ver> / aarch64_generic-<ver>）。跟随主线版本，别钉死在旧版。
      OPENWRT_VERSION: '25.12.6'
      # 本仓库被挂载为 SDK 的一个 feed，此名即 /feed 的挂载源名
      SDK_FEEDNAME: mihomo
      # 一次编这两个包；luci-app-mihomo 硬依赖 +mihomo，会连带先编 mihomo
      SDK_PACKAGES: mihomo luci-app-mihomo

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          # 发布描述要写「相对上一次发布的改动」，需要完整提交历史与 tag；
          # 默认的浅克隆（depth=1）会让 `git log <prev-tag>..HEAD` 直接失败。
          fetch-depth: 0
          fetch-tags: true

      - name: Check exec bits of luci package scripts
        run: |
          # luci.mk 用 `cp -pR` 把 luci-app-mihomo/root/ 原样搬进包，不走
          # $(INSTALL_BIN)，所以包内脚本的权限位完全由 git 索引里的 mode 决定：
          # 索引记成 100644 时，包能正常安装、脚本却不可执行（页面调用直接失败），
          # 属于静默失败。Windows 上尤其容易踩 —— core.filemode=false，NTFS 也没有
          # exec 位，新建的 root/ 下脚本默认被记成 100644。
          # 修复：git update-index --add --chmod=+x <path>
          fail=0
          while IFS=$'\t' read -r meta path; do
            case "$path" in
              luci-app-mihomo/root/*) ;;
              *) continue ;;
            esac
            mode=${meta%% *}
            if [ "$(head -c 2 "$path" 2>/dev/null)" = '#!' ] && [ "$mode" != "100755" ]; then
              echo "::error file=${path}::包内脚本的索引模式是 ${mode}，应为 100755"
              fail=1
            fi
          done < <(git ls-files --stage)
          if [ "$fail" != 0 ]; then
            echo "修复方式: git update-index --add --chmod=+x <path>"
            exit 1
          fi
          echo "OK: luci-app-mihomo/root/ 下的脚本索引模式均为 100755"

      - name: Read package versions
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          MIHOMO_VER=$(grep -m1 '^PKG_VERSION:=' mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          MIHOMO_REL=$(grep -m1 '^PKG_RELEASE:=' mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          LUCI_VER=$(grep -m1 '^PKG_VERSION:=' luci-app-mihomo/Makefile | cut -d= -f2 | tr -d ' ')
          LUCI_REL=$(grep -m1 '^PKG_RELEASE:=' luci-app-mihomo/Makefile | cut -d= -f2 | tr -d ' ')

          MIHOMO_FULL="${MIHOMO_VER}-r${MIHOMO_REL}"
          LUCI_FULL="${LUCI_VER}-r${LUCI_REL}"
          TAG="v${MIHOMO_FULL}-luci${LUCI_FULL}"

          # 与 prepare 阶段独立算出的 tag 对一遍。两处都从 Makefile 读，理论上必然
          # 相同；一旦不同说明有一处逻辑漂移了，宁可在这里失败，也别发错版本。
          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::tag 与 prepare 阶段不一致（本步 ${TAG} / prepare ${EXPECTED_TAG}）"
            exit 1
          fi

          {
            echo "MIHOMO_VER=${MIHOMO_VER}"
            echo "MIHOMO_REL=${MIHOMO_REL}"
            echo "MIHOMO_FULL=${MIHOMO_FULL}"
            echo "LUCI_VER=${LUCI_VER}"
            echo "LUCI_REL=${LUCI_REL}"
            echo "LUCI_FULL=${LUCI_FULL}"
            echo "TAG=${TAG}"
            echo "TITLE=mihomo ${MIHOMO_FULL} + luci-app-mihomo ${LUCI_FULL}"
          } >> $GITHUB_ENV

          {
            echo "### 待发布版本"
            echo ""
            echo "| 软件包 | 版本 |"
            echo "| --- | --- |"
            echo "| mihomo | ${MIHOMO_FULL} |"
            echo "| luci-app-mihomo | ${LUCI_FULL} |"
            echo ""
            echo "tag: ${TAG}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Generate build keys
        run: |
          # 包签名：私钥写进 KEY_BUILD（$GITHUB_ENV），SDK 动作会把它带进容器，
          # 于是 entrypoint 里 CONFIG_SIGNED_PACKAGES=y，产出的 apk 带签名。
          sudo apt-get update
          sudo apt-get install -y signify-openbsd
          signify-openbsd -G -n -c 'DO NOT USE - OpenWrt packages feed CI' -p packages_ci.pub -s packages_ci.sec
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "KEY_BUILD<<$EOF" >> "$GITHUB_ENV"
          cat packages_ci.sec >> "$GITHUB_ENV"
          echo "$EOF" >> "$GITHUB_ENV"

      # 用官方 SDK 镜像编译：SDK 由镜像自带（按 ARCH 选 tag），宿主机不再下载
      # SDK、也不需要 build-essential / pyelftools 那一套。
      #
      # 为什么不用 openwrt/gh-action-sdk 这个 composite action：
      #   它在 `docker run` 里对 --env 做了白名单（build / feedname / packages /
      #   v / index / key_build ...），**FIXUP 不在名单里**，而 entrypoint 会跑
      #   `make package/<pkg>/check`，然后用 grep 直接匹配日志里的
      #   "HASH uses deprecated hash," 并 exit 1。本包有意用 `HASH:=skip`
      #   （geo 数据与上游 tag tarball 都不该钉死校验和），在 SDK 25.12 上必然
      #   命中这条 —— 传不进 FIXUP 就只能把 checksum 写死再周期性失效。
      #   所以这里直接 docker run 官方镜像 + 官方 entrypoint，自己控制 --env，
      #   带上 FIXUP=1 让 fixup-makefile.pl 在容器内把 hash 就地补全（只改
      #   /feed 里的工作区副本，不会提交）。
      #
      # 一次只能编一个 ARCH，所以两个架构各一个 step；产物按 ARCH 分目录，
      # 后面 Collect 步骤统一收拢。
      #
      # entrypoint 在 PACKAGES 非空时会先跑 `make package/<pkg>/download` 再
      # `check` 再 `compile` —— mihomo 用 Download/ 宏拿的 Country.mmdb /
      # geoip.dat / geosite.dat 正好被这一步拉齐，不需要在 workflow 里另写。
      #
      # INDEX: '1' 让容器里用 apk mkndx + adbdump 现建一次索引，等于用设备/
      # ImageBuilder 的同一套 apk-tools 校验产物能不能被索引，拦在发布之前。
      # 两个架构各用一个独立的 ARTIFACTS_DIR：动作结束时是 `mv bin/ /artifacts/`，
      # 若两次都指向同一个目录，第二次会变成 bin/bin 嵌套。目录必须先存在。
      - name: Prepare artifact dirs
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/x86_64" "$GITHUB_WORKSPACE/artifacts/aarch64_generic"

      # entrypoint 从 gh-action-sdk 的同一个 commit 取，行为与用 action 时一致；
      # 钉 SHA 是为了不让上游改动悄悄改变构建语义。
      - name: Fetch SDK entrypoint
        env:
          SDK_ACTION_SHA: '7fc2640243284ecc44f4a9c3f749a61746ee02cb'
        run: |
          set -eu
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/openwrt/gh-action-sdk/${SDK_ACTION_SHA}/entrypoint.sh" \
            -o "${RUNNER_TEMP}/sdk-entrypoint.sh"
          chmod +x "${RUNNER_TEMP}/sdk-entrypoint.sh"

      - name: Build APKs (x86_64)
        env:
          ARCH: x86_64-${{ env.OPENWRT_VERSION }}
          FEEDNAME: ${{ env.SDK_FEEDNAME }}
          PACKAGES: ${{ env.SDK_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/x86_64
          V: s
          INDEX: '1'
        run: bash .ci/build-in-sdk.sh

      - name: Build APKs (aarch64_generic)
        env:
          ARCH: aarch64_generic-${{ env.OPENWRT_VERSION }}
          FEEDNAME: ${{ env.SDK_FEEDNAME }}
          PACKAGES: ${{ env.SDK_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/aarch64_generic
          V: s
          INDEX: '1'
        run: bash .ci/build-in-sdk.sh

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist

          for ARCH in x86_64 aarch64_generic; do
            d="artifacts/${ARCH}/bin/packages"
            if [ ! -d "$d" ]; then
              echo "::error::没有产物目录 $d（该架构的构建可能被跳过或失败）"
              exit 1
            fi

            find "$d" \( -name 'mihomo*.apk' -o -name 'luci-app-mihomo*.apk' \) -print | while read -r f; do
              base=$(basename "$f" .apk)
              case "$base" in
                # luci-app-mihomo is arch-independent ("noarch") but is emitted
                # into the target arch dir, so keep a single unsuffixed copy;
                # mihomo itself is arch-specific and needs the suffix.
                luci-app-mihomo*) dst="dist/${base}.apk" ;;
                *)                dst="dist/${base}_${ARCH}.apk" ;;
              esac
              cp -f "$f" "$dst"
              echo "collected: $dst"
            done
          done

          echo "--- release assets ---"
          ls -l dist/
          [ -n "$(ls -A dist 2>/dev/null)" ] || { echo "::error::no APK was produced"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # ---------- release notes ----------
          # 正文不带自身标题与构建说明：版本号已由 Release 标题（--title）给出，
          # 正文里再写一遍会与页面标题完全重复。正文 = 版本表 + 本次改动。
          cat > release_notes.md <<'EOF'
          | 软件包 | 版本 | 架构 |
          | --- | --- | --- |
          | mihomo | `@MIHOMO_FULL@` | x86_64、aarch64_generic |
          | luci-app-mihomo | `@LUCI_FULL@` | all（与架构无关，两个架构通用） |

          EOF

          # ---------- 本次改动（相对上一次发布）----------
          # 正文主体是「相对上一次发布的改动」，由上一次 Release 的 tag 到本次提交
          # 之间的提交列表生成（按 conventional-commit 前缀分组）。
          PREV=$(gh release list --limit 30 --json tagName \
                   --jq "[.[] | select(.tagName != \"${TAG}\")][0].tagName" 2>/dev/null || true)

          # 兜底：万一本地没有上一个 tag（理论上有 fetch-depth: 0 就有），按需补取
          if [ -n "${PREV}" ] && ! git rev-parse -q --verify "refs/tags/${PREV}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/${PREV}:refs/tags/${PREV}" >/dev/null 2>&1 || true
          fi

          if [ -n "${PREV}" ] && git rev-parse -q --verify "refs/tags/${PREV}" >/dev/null 2>&1; then
            echo "## 本次改动（相对上一次发布 \`${PREV}\`）" >> release_notes.md
            RANGE="${PREV}..${GITHUB_SHA}"
          elif [ -n "${PREV}" ]; then
            echo "::warning::上一次发布为 ${PREV}，但本地取不到该 tag，退化为输出全部提交"
            echo "## 本次改动" >> release_notes.md
            RANGE=""
          else
            echo "## 本次改动（首次发布）" >> release_notes.md
            RANGE=""
          fi
          echo "" >> release_notes.md

          if [ -n "${RANGE}" ]; then
            git log --no-merges --pretty='%s' "${RANGE}" > changes.txt
          else
            git log --no-merges --pretty='%s' "${GITHUB_SHA}" > changes.txt
          fi

          if [ -s changes.txt ]; then
            awk '
              # 纯维护类提交（ci / build / chore）与用户无关，整条不进描述
              /^(ci|build|chore)(\(|:|!)/ { next }
              {
                line = $0
                type = "其他"
                if      (line ~ /^feat(\(|:|!)/)             type = "新增"
                else if (line ~ /^fix(\(|:|!)/)              type = "修复"
                else if (line ~ /^(refactor|perf)(\(|:|!)/)  type = "重构与优化"
                else if (line ~ /^docs(\(|:|!)/)             type = "文档"
                sub(/^[A-Za-z]+(\([^)]*\))?!?:[ \t]*/, "", line)
                if (!(type in seen)) { order[++n] = type; seen[type] = 1 }
                body[type] = body[type] "- " line "\n"
              }
              END {
                # 过滤后可能一条不剩（例如整段都是 ci），此处兜底，避免留下空章节
                if (n == 0) { print "与上一次发布相比没有代码改动。"; exit }
                for (i = 1; i <= n; i++) printf "**%s**\n\n%s\n", order[i], body[order[i]]
              }
            ' changes.txt >> release_notes.md
          else
            echo "与上一次发布相比没有代码改动（同版本重复运行，仅重新构建并覆盖资产）。" >> release_notes.md
            echo "" >> release_notes.md
          fi

          sed -i "s|@MIHOMO_FULL@|${MIHOMO_FULL}|g; s|@LUCI_FULL@|${LUCI_FULL}|g" release_notes.md

          # ---------- tag ----------
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，沿用现有 tag"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "已创建 tag ${TAG} -> ${GITHUB_SHA}"
          fi

          # ---------- release ----------
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} 已存在，覆盖其中的 APK 资产（如需区分新产物请先递增 PKG_RELEASE）"
            gh release upload "${TAG}" dist/*.apk --clobber
            # 同一版本重跑时描述也要一并刷新，否则会停留在上一次运行生成的正文
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release_notes.md
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file release_notes.md \
              dist/*.apk
          fi

          echo "release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # 发布完自动清理旧 Release：只保留最新 5 个（脚本幂等，数量不超上限时空跑）。
      # 在 build 里做而不是单独一个 workflow，是为了「发完顺手清」——不依赖任何
      # 外部定时器，也不需要人工干预。单独补跑见 prune-releases.yml。
      # ⚠ 必须放在 Release 创建/更新之后：它会按 created_at 倒序裁掉尾部。
      - name: Prune old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: '5'
        run: bash .ci/prune-releases.sh
