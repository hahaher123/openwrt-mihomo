name: 每周检查 mihomo 上游版本

# 触发方式：
#   1. 定时 —— 每周一探测一次 MetaCubeX/mihomo 的最新正式版（draft / prerelease
#      不计入），周四再兜底探测一次。
#   2. 手动 —— Actions 页面 "Run workflow"，用于立即补跑；上游没有新版本时勾选
#      force 可强制重新构建当前版本（等价于到 build.yml 手动跑一次 force）。
#
# 为什么要两条 cron、且都不在整点：
#   GitHub 文档明确写着 schedule 事件在整点高负载时「排队的任务可能被丢弃」，
#   建议错开整点。本 workflow 首版写的是 `0 2 * * 1`，2026-10-19 那次 02:00 UTC
#   就被直接丢了 —— 一次 run 都没产生（不是失败，是根本没派发）。所以主探测挪到
#   02:17 UTC，另外加一条周四的兜底；脚本本身幂等，没有新版本就空跑退出。
#
# 逻辑：
#   上游版本 > Makefile 的 PKG_VERSION 时，改写 mihomo/Makefile：
#     PKG_VERSION := <上游最新>
#     PKG_RELEASE := 1        （按仓库约定，升上游版本时修订号复位）
#   提交并推送，然后显式 dispatch build.yml —— GITHUB_TOKEN 推送产生的 push
#   事件不会触发其它 workflow（GitHub 防递归），不 dispatch 就不会构建。
#
# 说明：mihomo 包用 PKG_SOURCE_URL 拉上游 tag 的源码 tarball 自行编译，
#   PKG_HASH=skip，因此跟进版本只需改 PKG_VERSION，无需同步任何校验和；
#   也没有预编译资产命名变化的兼容问题。

on:
  schedule:
    # 主探测：每周一 02:17 UTC = 北京时间 10:17。刻意错开整点（GitHub 整点丢事件）。
    - cron: '17 2 * * 1'
    # 兜底：每周四 18:47 UTC = 北京时间周五 02:47。周一那次若又被丢，这里补上。
    - cron: '47 18 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: '上游没有新版本时也触发一次构建（重新发布当前版本）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 提交 Makefile 并推送
  actions: write    # dispatch build.yml

# 定时与手动不要并发改同一个 Makefile。
concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    name: 探测上游并跟进
    runs-on: ubuntu-latest
    outputs:
      newer: ${{ steps.probe.outputs.newer }}
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 探测上游最新正式版
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          CUR=$(sed -n 's/^PKG_VERSION:=//p' mihomo/Makefile | head -n1 | tr -d ' ')
          [ -n "$CUR" ] || { echo "::error::读不到 mihomo/Makefile 的 PKG_VERSION"; exit 1; }

          # releases/latest 只返回最新正式版；API 失败时宁可报错，不要当成"无更新"静默跳过
          TAG=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name // empty')
          [ -n "$TAG" ] || { echo "::error::上游 API 未返回 tag_name"; exit 1; }
          LATEST=${TAG#v}

          echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::上游 tag 不是 x.y.z 形式: $TAG"; exit 1; }

          # 只在「不相等且排序更大」时跟进，避免上游回退 / 本仓库超前时降级
          NEWER=false
          if [ "$LATEST" != "$CUR" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
            NEWER=true
          fi

          echo "current=${CUR}"   >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "newer=${NEWER}"   >> "$GITHUB_OUTPUT"

          {
            echo "### 上游版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 当前 PKG_VERSION | \`${CUR}\` |"
            echo "| 上游最新正式版 | \`${LATEST}\` |"
            echo "| 是否需要跟进 | ${NEWER} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 改写 Makefile 并推送
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu

          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=${LATEST}|" mihomo/Makefile
          sed -i "s|^PKG_RELEASE:=.*|PKG_RELEASE:=1|" mihomo/Makefile
          echo "--- 改写后 ---"
          grep -E '^PKG_(VERSION|RELEASE):=' mihomo/Makefile

          if git diff --quiet -- mihomo/Makefile; then
            echo "版本未变化（force 模式）：跳过提交，直接触发构建"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mihomo/Makefile
          # 提交信息按仓库约定：前缀 + 一句话，不写包名前缀、不写 body
          git commit -m "feat: 升级 mihomo 上游版本至 ${LATEST}"
          git push origin HEAD:main

      - name: 触发构建与发布
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 必须显式 dispatch：GITHUB_TOKEN 推送的 commit 不会触发 push 型 workflow
          gh workflow run build.yml --ref main
          echo "已触发 build.yml（tag 将由 build.yml 按两个 Makefile 的版本自动生成）"

      - name: 无新版本
        if: steps.probe.outputs.newer != 'true' && !inputs.force
        run: |
          echo "上游与 Makefile 版本一致或更旧，本次不做改动。"

  # 缓存保活：上游没升级（也没 force）时不触发 build.yml，两份 Go 编译缓存
  # （GOCACHE / GOMODCACHE）就不会被任何构建访问 —— 而 GitHub 的 Actions 缓存
  # 按「最后访问时间」7 天不访问即驱逐，mihomo 上游发版间隔一旦超过一周，
  # 下次跟进版本就要全量冷编译（重下全部 Go 模块 + 重编全部依赖包）。
  # 这里在不构建的日子里用 cache/restore（只恢复、不回存）把缓存各摸一次，
  # 刷新驱逐时钟；真正的升级构建走 build.yml，天然会恢复缓存，不需要本 job。
  # ⚠ 缓存条目的版本哈希由 key + 路径列表 + 压缩工具共同决定，路径列表必须
  # 与 build.yml 的 cache path 逐字节一致（含相对路径），否则 key 相同也静默 miss。
  # ⚠ restore-keys 里的 SDK 版本与 build.yml 的 OPENWRT_VERSION（'25.12.6'）保持
  # 一致 —— build.yml 升 SDK 版本时这里要同步改。
  keepalive:
    name: keep Go caches warm (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.newer != 'true' && github.event.inputs.force != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 与 build.yml 的 build matrix 保持一致。
        arch: [x86_64, aarch64_generic]
    steps:
      # restore 动作本身即刷新 7 天驱逐时钟。key 故意永不匹配，靠 restore-keys
      # 前缀命中现有缓存；restore-only 不回存，不新增条目。
      - name: Touch Go build cache (GOCACHE)
        uses: actions/cache/restore@v4
        with:
          path: go-cache/build
          key: keepalive-gocache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: gocache-${{ matrix.arch }}-25.12.6-

      - name: Touch Go module cache (GOMODCACHE)
        uses: actions/cache/restore@v4
        with:
          path: go-cache/mod
          key: keepalive-gomod-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: gomod-${{ matrix.arch }}-25.12.6-

      - name: Summary
        run: |
          {
            echo "### Cache keepalive (\`${{ matrix.arch }}\`)"
            echo ''
            echo '上游无新版本，未构建；已恢复 Go 编译缓存刷新 7 天驱逐时钟（不发 Release）。'
          } >> "$GITHUB_STEP_SUMMARY"
